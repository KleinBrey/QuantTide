[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-tide"
version = "1.0.0"
description = "FastAPI + DuckDB 的本地量化投研平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "duckdb>=1.3,<2",
  "pandas>=2.2,<4",
  "requests>=2.31,<3",
  "tqdm>=4.67,<5",
  "rich>=15,<16",
  "APScheduler>=3.11,<4",
  "pydantic-settings>=2.10,<3",
  "akshare>=1.18.91,<2",
  "tushare>=1.2.26,<2",
  "futu-api>=10,<11",
]

[dependency-groups]
dev = ["httpx>=0.28,<1"]

[project.scripts]
quant-api = "backend.run:main"
quant-sync = "backend.scripts.sync_daily_k_db:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.setuptools.package-data]
"backend.app.strategy" = ["strategies.json"]
